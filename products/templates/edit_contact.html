{% extends 'dashboard_base.html' %}

{% block title %}Edit Inquiry - KOPPEE Admin{% endblock %}
{% block page_title %}Edit Inquiry #{{ contact.id }}{% endblock %}
{% block menu_contacts %}active{% endblock %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0" style="border-radius: 12px;">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                <h5 class="m-0 font-weight-bold text-dark">Edit Message Record</h5>
                <a href="{% url 'contacts_page' %}" class="btn btn-sm btn-outline-secondary">
                    <i class="fa fa-arrow-left mr-1"></i> Back
                </a>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label class="font-weight-bold text-muted small">NAME *</label>
                        <input type="text" name="name" class="form-control" required value="{{ contact.name }}">
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold text-muted small">EMAIL *</label>
                        <input type="email" name="email" class="form-control" required value="{{ contact.email }}">
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold text-muted small">SUBJECT *</label>
                        <input type="text" name="subject" class="form-control" required value="{{ contact.subject }}">
                    </div>

                    <div class="form-group mb-4">
                        <label class="font-weight-bold text-muted small">MESSAGE *</label>
                        <textarea name="message" rows="5" class="form-control" required>{{ contact.message }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'contacts_page' %}" class="btn btn-light px-3 mr-2">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4 font-weight-bold text-white" style="background-color: #da9f5b; border-color: #da9f5b;">
                            <i class="fa fa-check mr-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
