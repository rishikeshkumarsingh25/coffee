{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - KOPPEE{% endblock %}

{% block extra_head %}
<style>
    .auth-card {
        max-width: 480px;
        margin: 60px auto;
        padding: 40px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa fa-key fa-3x text-primary mb-2"></i>
            <h3 class="text-uppercase font-weight-bold" style="color: #da9f5b; letter-spacing: 2px;">Password Recovery</h3>
            <p class="text-muted small">Enter your email and we'll send you an OTP to reset your password</p>
        </div>

        <form method="POST" action="{% url 'forgot_password' %}">
            {% csrf_token %}

            <div class="form-group mb-4">
                <label class="font-weight-bold small text-muted">REGISTERED EMAIL ADDRESS</label>
                <div class="input-group">
                    <div class="input-group-prepend">
                        <span class="input-group-text"><i class="fa fa-envelope text-muted"></i></span>
                    </div>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block font-weight-bold py-3" style="border-radius: 6px;">
                <i class="fa fa-paper-plane mr-2"></i> Send Reset OTP
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="small text-muted font-weight-bold">
                <i class="fa fa-arrow-left mr-1"></i> Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
