{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - KOPPEE{% endblock %}

{% block extra_head %}
<style>
    .auth-card {
        max-width: 480px;
        margin: 60px auto;
        padding: 40px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fa fa-lock fa-3x text-primary mb-2"></i>
            <h3 class="text-uppercase font-weight-bold" style="color: #da9f5b; letter-spacing: 2px;">Set New Password</h3>
            <p class="text-muted small">Enter the 6-digit OTP sent to your email and your new password</p>
        </div>

        <form method="POST" action="{% url 'reset_password' %}">
            {% csrf_token %}

            <div class="form-group mb-3">
                <label class="font-weight-bold small text-muted">6-DIGIT OTP *</label>
                <input type="text" name="otp" class="form-control text-center font-weight-bold" style="letter-spacing: 6px; font-size: 20px;" placeholder="······" maxlength="6" required autofocus>
            </div>

            <div class="form-group mb-3">
                <label class="font-weight-bold small text-muted">NEW PASSWORD (MIN 6 CHARACTERS) *</label>
                <input type="password" name="password" class="form-control" placeholder="New password" minlength="6" required>
            </div>

            <div class="form-group mb-4">
                <label class="font-weight-bold small text-muted">CONFIRM NEW PASSWORD *</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block font-weight-bold py-3" style="border-radius: 6px;">
                <i class="fa fa-check-circle mr-2"></i> Update Password & Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'login' %}" class="small text-muted font-weight-bold">
                <i class="fa fa-arrow-left mr-1"></i> Cancel & Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
